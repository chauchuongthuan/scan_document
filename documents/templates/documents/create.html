{% extends 'admin/layouts/admin.html' %} {% load static %} {% block content %}

<div class="p-4">
  <ol class="flex text-gray-500 font-semibold dark:text-white-dark pb-4">
    <li>
      <a
        href="javascript:;"
        class="hover:text-gray-500/70 dark:hover:text-white-dark/70"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4 shrink-0"
        >
          <path
            opacity="0.5"
            d="M2 12.2039C2 9.91549 2 8.77128 2.5192 7.82274C3.0384 6.87421 3.98695 6.28551 5.88403 5.10813L7.88403 3.86687C9.88939 2.62229 10.8921 2 12 2C13.1079 2 14.1106 2.62229 16.116 3.86687L18.116 5.10812C20.0131 6.28551 20.9616 6.87421 21.4808 7.82274C22 8.77128 22 9.91549 22 12.2039V13.725C22 17.6258 22 19.5763 20.8284 20.7881C19.6569 22 17.7712 22 14 22H10C6.22876 22 4.34315 22 3.17157 20.7881C2 19.5763 2 17.6258 2 13.725V12.2039Z"
            stroke="currentColor"
            stroke-width="1.5"
          ></path>
          <path
            d="M12 15L12 18"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          ></path>
        </svg>
      </a>
    </li>
    <li class="before:content-['/'] before:px-1.5">
      <a href="{% url 'document-list' %}">Hợp đồng</a>
    </li>
    <li class="before:content-['/'] before:px-1.5">
      <a
        href="javascript:;"
        class="text-black dark:text-white-light hover:text-black/70 dark:hover:text-white-light/70"
        >Tạo mới</a
      >
    </li>
  </ol>
  <div class="panel">
    <h5 class="mb-5 text-lg font-semibold dark:text-white-light">
        Tạo hợp đồng
    </h5>
    <button class="btn btn-primary w-1/12" onclick="showScanModal()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
        <path fill="currentColor" d="M3 4v5h2V5h4V3H4a1 1 0 0 0-1 1zm18 5V4a1 1 0 0 0-1-1h-5v2h4v4h2zm-2 10h-4v2h5a1 1 0 0 0 1-1v-5h-2v4zM9 21v-2H5v-4H3v5a1 1 0 0 0 1 1h5zM2 11h20v2H2z"/>
      </svg>
        Scan
    </button>
    <!-- Modal Scan -->
    <div id="scanModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg w-96 border">
            <h2 class="text-lg font-bold mb-4">Scan File</h2>
            <form id="scanForm">
                <input type="file" name="pdf_file" id="pdfFileInput" accept=".pdf, .png, .jpg, .jpeg" required class="mb-4">
                <div class="mb-4">
                    <label>Form Type</label>
                    <select name="form_type" class="form-input" id="formType">
                        <option value="form_1">Purchase Contract</option>
                        <option value="form_2">Comco Trading</option>
                        <option value="form_3">Commercial Invoice</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" onclick="hideScanModal()" class="btn btn-sm btn-outline-danger">Hủy</button>
                    <button type="submit" class="btn btn-sm btn-primary">Upload</button>
                </div>
            </form>
        </div>
    </div>
    <div>
      <form
        id="documentForm"
        method="post"
        enctype="multipart/form-data"
        action="{% url 'document-create' %}"
        class="space-y-5"
      >
        {% csrf_token %}
        <div class="flex flex-col md:flex-row gap-8">
          <div class="w-full space-y-6">
            <!-- Comco ref, Buyer ref, Contract date, Price -->
            <div class="grid grid-cols-4 gap-4">
              <div id="group_comco_ref">
                <label class="mt-2" for="comco_ref">Comco ref</label>
                <div class="flex items-center gap-2">
                    <input
                        id="comco_ref"
                        type="text"
                        name="comco_ref"
                        class="form-input"
                    />
                </div>
              </div>
              <div id="group_buyer_ref">
                <label class="mt-2" for="buyer_ref">Buyer ref</label>
                <div class="flex items-center gap-2">
                    <input
                        id="buyer_ref"
                        type="text"
                        name="buyer_ref"
                        class="form-input"
                    />
                </div>
              </div>
              <div id="group_contract_date">
                <label class="mt-2" for="contract_date">Contract date</label>
                <div class="flex items-center gap-2">
                    <input
                        id="contract_date"
                        type="date"
                        name="contract_date"
                        class="form-input"
                    />
                </div>
              </div>
              <div id="group_price">
                <label class="mt-2" for="price">Price</label>
                <div class="flex items-center gap-2">
                    <input
                        id="price"
                        type="text"
                        name="price"
                        class="form-input"
                    />
                </div>
              </div>
            </div>
            <!-- DDS & GEO, DOCS, Shippers, Buyers -->
            <div class="grid grid-cols-4 gap-4">
              <div id="group_dds_and_geo">
                <label class="mt-2" for="dds_and_geo">DDS & GEO</label>
                <div class="flex items-center gap-2">
                    <input
                        id="dds_and_geo"
                        type="text"
                        name="dds_and_geo"
                        class="form-input"
                    />
                </div>
              </div>
              <div id="group_docs">
                <label class="mt-2" for="docs">Docs</label>
                <div class="flex items-center gap-2">
                    <input
                        id="docs"
                        type="text"
                        name="docs"
                        class="form-input"
                    />
                </div>
              </div>
              <div id="group_shippers">
                <label class="mt-2" for="shippers">Shippers</label>
                <div class="flex items-center gap-2">
                    <input
                        id="shippers"
                        type="text"
                        name="shippers"
                        class="form-input"
                    />
                </div>
              </div>
              <div id="group_buyers">
                <label class="mt-2" for="buyers">Buyers</label>
                <div class="flex items-center gap-2">
                    <input
                        id="buyers"
                        type="text"
                        name="buyers"
                        class="form-input"
                    />
                </div>
              </div>
            </div>
            <!-- Quality, Quantity, Conts no, Packing -->
            <div class="grid grid-cols-4 gap-4">
              <div id="group_quality">
                <label class="mt-2" for="quality">Quality</label>
                <div class="flex items-center gap-2">
                    <input
                        id="quality"
                        type="text"
                        name="quality"
                        class="form-input"
                    />
                </div>
              </div>
              <div id="group_quantity">
                <label class="mt-2" for="quantity">Quantity</label>
                <div class="flex items-center gap-2">
                    <div class="w-11/12">
                        <input
                            id="quantity"
                            type="text"
                            name="quantity"
                            class="form-input"
                        />
                    </div>
                    <div class="w-1/12">
                        (MT)
                    </div>
                </div>
              </div>
              <div id="group_conts_no">
                <label class="mt-2" for="conts_no">Conts no</label>
                <div class="flex items-center gap-2">
                    <input
                        id="conts_no"
                        type="text"
                        name="conts_no"
                        class="form-input"
                    />
                </div>
              </div>
              <div id="group_packing">
                <label class="mt-2" for="packing">Packing</label>
                <div class="flex items-center gap-2">
                    <input
                        id="packing"
                        type="text"
                        name="packing"
                        class="form-input"
                    />
                </div>
              </div>
            </div>
            <!-- Shipment period, Sample, Result, Stuffing date -->
            <div class="grid grid-cols-4 gap-4">
              <div id="group_shipment_period">
                <label class="mt-2" for="shipment_period">Shipment period</label>
                <div class="flex items-center gap-2">
                    <input
                        id="shipment_period"
                        type="text"
                        name="shipment_period"
                        class="form-input"
                    />
                </div>
              </div>
              <div id="group_sample">
                <label class="mt-2" for="sample">Sample</label>
                <div class="flex items-center gap-2">
                    <input
                        id="sample"
                        type="text"
                        name="sample"
                        class="form-input"
                    />
                </div>
              </div>
              <div id="group_result">
                <label class="mt-2" for="result">Result</label>
                <div class="flex items-center gap-2">
                    <input
                        id="result"
                        type="text"
                        name="result"
                        class="form-input"
                    />
                </div>
              </div>
              <div id="group_stuffing_date">
                <label class="mt-2" for="stuffing_date">Stuffing date</label>
                <div class="flex items-center gap-2">
                      <input
                      id="stuffing_date"
                      type="date"
                      name="stuffing_date"
                      class="form-input"
                  />
                </div>
              </div>
            </div>
            <!-- Carriers, Booking no, ETD, ETA -->
            <div class="grid grid-cols-4 gap-4">
              <div id="group_carriers">
                <label class="mt-2" for="carriers">Carriers</label>
                <div class="flex items-center gap-2">
                    <input
                        id="carriers"
                        type="text"
                        name="carriers"
                        class="form-input"
                    />
                </div>
              </div>
              <div id="group_booking_no">
                <label class="mt-2" for="booking_no">Booking no</label>
                <div class="flex items-center gap-2">
                    <input
                        id="booking_no"
                        type="text"
                        name="booking_no"
                        class="form-input"
                    />
                </div>
              </div>
              <div id="group_etd">
                <label class="mt-2" for="etd">ETD</label>
                <div class="flex items-center gap-2">
                    <input
                        id="etd"
                        type="date"
                        name="etd"
                        class="form-input"
                    />
                </div>
              </div>
              <div id="group_eta">
                <label class="mt-2" for="eta">ETA</label>
                <div class="flex items-center gap-2">
                      <input
                      id="eta"
                      type="text"
                      name="eta"
                      class="form-input"
                  />
                </div>
              </div>
            </div>
            <!-- Destination, Inspectors, Warehouse, Status -->
            <div class="grid grid-cols-4 gap-4">
              <div id="group_destination">
                <label class="mt-2" for="destination">Destination</label>
                <div class="flex items-center gap-2">
                    <input
                        id="destination"
                        type="text"
                        name="destination"
                        class="form-input"
                    />
                </div>
              </div>
              <div id="group_inspectors">
                <label class="mt-2" for="inspectors">Inspectors</label>
                <div class="flex items-center gap-2">
                    <input
                        id="inspectors"
                        type="text"
                        name="inspectors"
                        class="form-input"
                    />
                </div>
              </div>
              <div id="group_warehouse">
                <label class="mt-2" for="warehouse">Warehouse</label>
                <div class="flex items-center gap-2">
                    <input
                        id="warehouse"
                        type="text"
                        name="warehouse"
                        class="form-input"
                    />
                </div>
              </div>
              <div id="group_status">
                <label class="mt-2" for="status">Status</label>
                <div class="flex items-center gap-2">
                      <input
                      id="status"
                      type="text"
                      name="status"
                      class="form-input"
                  />
                </div>
              </div>
            </div>
            <!-- Weight claim, Remark -->
            <div class="grid grid-cols-2 gap-4">
              <div id="group_weight_claim">
                <label class="mt-2" for="weight_claim">Weight claim</label>
                <div class="flex items-center gap-2">
                    <input
                        id="weight_claim"
                        type="text"
                        name="weight_claim"
                        class="form-input"
                    />
                </div>
              </div>
              <div id="group_remark">
                <label class="mt-2" for="remark">Remark</label>
                <div class="flex items-center gap-2">
                    <input
                        id="remark"
                        type="text"
                        name="remark"
                        class="form-input"
                    />
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="mt-6 flex justify-end">
          <button type="submit" onclick="submitForm(event)" class="btn btn-primary">Thêm mới</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script defer src="{% static 'cassets/js/sweetalert.min.js' %}"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const documentForm = document.getElementById('documentForm');
        const requiredFields = [
            'comco_ref', 'buyer_ref', 'contract_date', 'price', 'shippers', 'buyers', 
            'quality', 'quantity', 'conts_no', 'packing', 'shipment_period', 'carriers', 
            'booking_no', 'destination'
        ];

        requiredFields.forEach(field => {
            const input = documentForm[field];
            if (input) {
                input.addEventListener("input", () => {
                    if (input.value.trim() !== "") {
                        document.getElementById('group_' + field).classList.remove("has-error");
                    }
                });
            }
        });
    });
    function submitForm(event) {
        const documentForm = document.getElementById('documentForm');
        event.preventDefault();

        const requiredFields = [
            'comco_ref', 'buyer_ref', 'contract_date', 'price', 'shippers', 'buyers', 
            'quality', 'quantity', 'conts_no', 'packing', 'shipment_period', 'destination'
        ];
        if (requiredFields.some(field => !documentForm[field].value)) {
            requiredFields.forEach(field => {
                if (!documentForm[field].value) {
                    document.getElementById('group_' + field).classList.add('has-error');
                }
            });
            showMessage("Please fill in all required fields.", "error");
            return;
        }
        const formData = new FormData(documentForm);
        
        fetch(documentForm.action, {
        method: 'POST',
        body: formData,
        headers: {
            'X-Requested-With': 'XMLHttpRequest',
            'X-CSRFToken': '{{ csrf_token }}'
        }
        })
        .then(response => response.json())
        .then(data => {
        showMessage(data.message, data.status);
        if (data.status === 'success' && data.redirect) {
            setTimeout(() => {
            window.location.href = data.redirect;
            }, 1000);
        }
        })
        .catch(error => {
        showMessage('An error occurred while processing your request.', 'error');
        });
    }
    function showScanModal() {
        document.getElementById('scanModal').classList.remove('hidden');
    }
    function hideScanModal() {
        document.getElementById('scanModal').classList.add('hidden');
        document.getElementById('pdfFileInput').value = '';
    }

    document.getElementById('scanForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData(this);

        try {
            const response = await fetch("{% url 'document-scan-pdf' %}", {
                method: "POST",
                body: formData,
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}",
                }
            });

            const result = await response.json();

            if (result.status === "success") {
                showMessageScan(result.message, result.status);
                console.log("result.data scan::", result.data);
                fillForm(result.data);
                hideScanModal();
                
            }
            else {
                showMessageScan(result.message, result.status);
                hideScanModal();
            }
        } catch (error) {
            showMessageScan("Lỗi khi upload file: " + error, "error");
        }
    });
    function showMessageScan(msg = "", type = 'success') {
        const toast = window.Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 5000
        });
        toast.fire({
            icon: type,
            title: msg,
            padding: '2em'
        });
    }
    function fillForm(data) {
        // List of form fields and their corresponding keys in the 'data' object
        const fields = [
            'comco_ref',
            'buyer_ref',
            'contract_date',
            'price',
            'dds_and_geo',
            'docs',
            'shippers',
            'buyers',
            'quality',
            'quantity',
            'conts_no',
            'packing',
            'shipment_period',
            'sample',
            'result',
            'stuffing_date',
            'carriers',
            'booking_no',
            'etd',
            'eta',
            'destination',
            'inspectors',
            'warehouse',
            'status',
            'weight_claim',
            'remark',
        ];

        fields.forEach(key => {
            // Check if the key exists in the data object AND its value is not null or undefined.
            // The check (data[key] !== null) also handles undefined, but it's clearer to check for both.
            if (data && data[key] !== undefined && data[key] !== null) {
                // Only update the form field if the received data is valid
                const formElement = document.getElementById(key);
                if (formElement) {
                    formElement.value = data[key];
                }
            }
        });
    }
    function showMessage(msg = '', type = 'success') {
        const toast = window.Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 3000
        });
        toast.fire({
            icon: type,
            title: msg,
            padding: '2em'
        });
    }
</script>
{% endblock %}
