{% extends 'admin/layouts/admin.html' %}
{% load static %}

{% block content %}
{% include 'components/common/confirm_modal.html' %}
<script src="{% static 'js/confirm_modal.js' %}"></script>
<div class="p-4">
    <ol class="flex text-gray-500 font-semibold dark:text-white-dark pb-4">
        <li>
            <a href="javascript:;" class="hover:text-gray-500/70 dark:hover:text-white-dark/70">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0">
                    <path opacity="0.5" d="M2 12.2039C2 9.91549 2 8.77128 2.5192 7.82274C3.0384 6.87421 3.98695 6.28551 5.88403 5.10813L7.88403 3.86687C9.88939 2.62229 10.8921 2 12 2C13.1079 2 14.1106 2.62229 16.116 3.86687L18.116 5.10812C20.0131 6.28551 20.9616 6.87421 21.4808 7.82274C22 8.77128 22 9.91549 22 12.2039V13.725C22 17.6258 22 19.5763 20.8284 20.7881C19.6569 22 17.7712 22 14 22H10C6.22876 22 4.34315 22 3.17157 20.7881C2 19.5763 2 17.6258 2 13.725V12.2039Z" stroke="currentColor" stroke-width="1.5"></path>
                    <path d="M12 15L12 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
                </svg>
            </a>
        </li>
        <li class="before:content-['/'] before:px-1.5"><a href="javascript:;">Tính toán</a></li>
    </ol>
    <div class="panel">
    <h5 class="mb-5 text-lg font-semibold dark:text-white-light">
        Get Calculated Momentum
    </h5>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="hidden fixed inset-0 bg-black/60 bg-opacity-50 flex items-center justify-center z-50 w-full h-full">
        <div class="bg-white p-6 rounded-lg flex items-center space-x-4">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
            <span class="text-lg font-medium">Đang xử lý...</span>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" class="hidden fixed inset-0 bg-black/60 flex items-start justify-center z-50 w-full h-full overflow-y-auto py-10">
        <div class="bg-white p-6 rounded-lg w-4/5 max-h-[90vh] overflow-y-auto">
            <!-- Container hiển thị kết quả trực tiếp (không dùng tab) -->
            <div id="tabContents"></div>

            <!-- Nút Close -->
            <div class="flex justify-center mt-6">
                <button type="button" class="btn btn-primary" onclick="document.getElementById('resultScreen').classList.add('hidden')">
                    Close
                </button>
            </div>
        </div>
    </div>

    <div>
        <form
            id="postForm"
            method="post"
            enctype="multipart/form-data"
            action="{% url 'get-calculated-momentum' %}"
            class="space-y-5"
        >
            {% csrf_token %}
            <div class="flex flex-col md:flex-row gap-8">
                <div class="w-full space-y-6">
                    <div class="grid grid-cols-4 gap-4">
                        <div>
                            <label class="mt-2" for="type">Type</label>
                            <select id="type" name="type" class="form-input">
                                <option value="1">Type 1 (Sentence)</option>
                                <option value="2">Type 2 (Chunk)</option>
                            </select>
                        </div>
                        <div>
                            <label class="mt-2" for="price_close">Price Close</label>
                            <input id="price_close" name="price_close" type="number" class="form-input" />
                        </div>
                        <div>
                            <label class="mt-2" for="iv">IV</label>
                            <input id="iv" name="iv" type="number" class="form-input" />
                        </div>
                        <div>
                            <label class="mt-2" for="gap">Gap</label>
                            <input id="gap" name="gap" type="number" class="form-input" />
                        </div>
                    </div>
                    <div class="grid grid-cols-1 gap-4">
                        <div>
                            <label class="mt-2" for="paragraph">Result from AI</label>
                            <div class="flex items-center gap-2">
                                <textarea
                                    id="paragraph"
                                    type="text"
                                    name="paragraph"
                                    class="form-input"
                                    rows="20"
                                ></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="mt-6 flex justify-end">
                <button type="submit" onclick="submitForm(event)" class="btn btn-primary">Tính toán</button>
            </div>
        </form>
    </div>
  </div>
</div>

<script>
    function showMessage(msg = "", type = 'success') {
        const toast = window.Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 3000,
        });
        toast.fire({
            icon: type,
            title: msg,
            padding: '2em'
        });
    }

    function submitForm(event) {
        const postForm = document.getElementById('postForm');
        event.preventDefault();

        const formData = new FormData(postForm);
        showLoadingScreen();
        fetch(postForm.action, {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'X-CSRFToken': '{{ csrf_token }}'
            }
        })
        .then(response => response.json())
        .then(data => {
            showMessage(data.message, data.status);
            if (data.status === 'success') {
                document.getElementById('resultScreen').classList.remove('hidden');
                renderResults(data.result);
            }
            hideLoadingScreen();
        })
        .catch(error => {
            console.error('Error:', error);
            showMessage('Submit failed', 'error');
            hideLoadingScreen();
        });
    }

    function showLoadingScreen() {
        document.getElementById('loadingScreen').classList.remove('hidden');
    }

    function hideLoadingScreen() {
        document.getElementById('loadingScreen').classList.add('hidden');
    }

    function renderResults(result) {
        const tabContents = document.getElementById('tabContents');
        tabContents.innerHTML = "";

        // Lấy dữ liệu effective_momentum và độ dài
        const momentum = result.effective_momentum || [];
        const sign_changed_momentum = result.sign_changed_effective_momentum || [];
        const sum_abs = result.sum_abs || 0;
        const price_calculated = result.price_calculated || 0;
        const calculated_momentum = result.calculated_momentum || [];
        const momentumLength = result.effective_momentum_length ?? (Array.isArray(momentum) ? momentum.length : 0);
        const nearest_index = result.nearest_index || 0;
        const nearest_gap = result.nearest_gap || 0;
        const nearest_gap_momentum = result.nearest_gap_momentum || 0;

        // Tạo giao diện kết quả
        tabContents.innerHTML = `
            <div class="border p-4 rounded-lg bg-gray-50 space-y-4">
                <div class="flex justify-between items-center pb-3 border-b">
                    <h3 class="text-lg font-semibold text-gray-800">Kết quả tính toán</h3>
                    <button id="btnCopyExcel" type="button" class="btn btn-secondary flex items-center gap-2">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        Copy Effective Momentum
                    </button>
                    <button id="btnCopySignChangedMomentum" type="button" class="btn btn-secondary flex items-center gap-2">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        Copy Sign Changed Momentum
                    </button>
                    <button id="btnCopyCalculatedMomentum" type="button" class="btn btn-secondary flex items-center gap-2">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        Copy Calculated Momentum
                    </button>
                </div>
                
                <div class="space-y-3">
                    <div>
                        <span class="font-bold text-gray-700">Momentum:</span>
                        <div class="p-3 bg-white border rounded font-mono text-sm break-words mt-1 max-h-48 overflow-y-auto">
                            ${JSON.stringify(momentum)}
                        </div>
                    </div>
                    <div>
                        <span class="font-bold text-gray-700">Sign Changed Momentum:</span>
                        <div class="p-3 bg-white border rounded font-mono text-sm break-words mt-1 max-h-48 overflow-y-auto">
                            ${JSON.stringify(sign_changed_momentum)}
                        </div>
                    </div>
                    <div>
                        <span class="font-bold text-gray-700">Calculated Momentum:</span>
                        <div class="p-3 bg-white border rounded font-mono text-sm break-words mt-1 max-h-48 overflow-y-auto">
                            ${JSON.stringify(calculated_momentum)}
                        </div>
                    </div>
                    <div>
                        <span class="font-bold text-gray-700">Số lượng:</span>
                        <span class="ml-2 font-mono font-bold text-primary bg-primary/10 px-2 py-1 rounded">${momentumLength} đoạn</span>
                    </div>
                    <div>
                        <span class="font-bold text-gray-700">Sum Abs:</span>
                        <span class="ml-2 font-mono font-bold text-primary bg-primary/10 px-2 py-1 rounded">${sum_abs}</span>
                    </div>
                    <div>
                        <span class="font-bold text-gray-700">Price Calculated:</span>
                        <span class="ml-2 font-mono font-bold text-primary bg-primary/10 px-2 py-1 rounded">±${price_calculated}</span>
                    </div>
                    <div>
                        <span class="font-bold text-gray-700">Nearest Gap:</span>
                        <span class="ml-2 font-mono font-bold text-primary bg-primary/10 px-2 py-1 rounded">Vị trí: ${nearest_index} - Giá trị: ${nearest_gap} - Momentum trước tính: ${nearest_gap_momentum}</span>
                    </div>
                </div>
            </div>
        `;

        // Sự kiện Copy chuẩn định dạng cho Excel
        document.getElementById('btnCopyExcel').onclick = () => {
            // Chuyển mảng thành chuỗi phân tách bằng tab (\t)
            // Excel nhận ký tự \t làm điểm phân chia cột tự động
            const textToCopy = Array.isArray(momentum) ? momentum.join('\t') : momentum;
            copyToClipboard(textToCopy);
        };
        
        document.getElementById('btnCopySignChangedMomentum').onclick = () => {
            // Chuyển mảng thành chuỗi phân tách bằng tab (\t)
            // Excel nhận ký tự \t làm điểm phân chia cột tự động
            const textToCopy = Array.isArray(sign_changed_momentum) ? sign_changed_momentum.join('\t') : sign_changed_momentum;
            copyToClipboard(textToCopy);
        };
        
        document.getElementById('btnCopyCalculatedMomentum').onclick = () => {
            // Chuyển mảng thành chuỗi phân tách bằng tab (\t)
            // Excel nhận ký tự \t làm điểm phân chia cột tự động
            const textToCopy = Array.isArray(calculated_momentum) ? calculated_momentum.join('\t') : calculated_momentum;
            copyToClipboard(textToCopy);
        };

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            
            // Giấu textarea đi để không làm giật giao diện
            textArea.style.position = "fixed";
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.opacity = "0";

            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showMessage('Đã copy kết quả (Sẵn sàng dán vào Excel)', 'success');
                } else {
                    showMessage('Copy thất bại', 'error');
                }
            } catch (err) {
                console.error('Fallback copy error:', err);
                showMessage('Copy thất bại', 'error');
            }

            document.body.removeChild(textArea);
        }

        // Hàm copy chính (Tự động chọn cách phù hợp)
        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                // Nếu là HTTPS hoặc localhost
                navigator.clipboard.writeText(text)
                    .then(() => {
                        showMessage('Đã copy kết quả (Sẵn sàng dán vào Excel)', 'success');
                    })
                    .catch(() => {
                        fallbackCopyTextToClipboard(text);
                    });
            } else {
                // Nếu truy cập qua IP (HTTP)
                fallbackCopyTextToClipboard(text);
            }
        }
    }
</script>
{% endblock %}
